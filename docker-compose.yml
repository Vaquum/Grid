name: grid
services:
  grid:
    build:
      context: .
      network: host
    image: grid:latest
    network_mode: host
    init: true
    command: ["python", "-m", "grid", "serve", "--project", "/data/project", "--bind", "127.0.0.1", "--port", "8490", "--public-origin", "https://grid.vaquum.fi", "--limen-cli", "/usr/local/bin/limen", "--limen-python", "/usr/local/bin/python", "--agent-file", "/tmp/grid-agent.json"]
    volumes:
      - project:/data
    tmpfs:
      - /tmp
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8490/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
volumes:
  project:
