[project]
name = "grid"
version = "0.1.0"
description = "Monitor a parameter sweep and see how each parameter moves the outcome."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]

[tool.ruff]
line-length = 79
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/py/test_logparse.py" = ["E501"]
