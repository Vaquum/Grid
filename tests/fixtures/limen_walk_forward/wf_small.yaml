schema_version: "1.0"
metadata:
  name: wf_small
  limen_version: "5.24.0"
  mode: development
  description: walk-forward logistic regression on the recorded hourly fixture, with acceptance thresholds
sfd:
  manifest:
    type: ml
    data_source:
      method: limen.data.HistoricalData.get_any_file
      params:
        file_path_or_url: tests/fixtures/spot_1h_20240101_20241231.parquet
    split_walk_forward:
      n_folds: 2
      test_bars: 49
      purge_bars: 4
      embargo_bars: 3
      anchored: true
    acceptance:
      min_deflated_sharpe_probability: 0.95
      max_pbo: 0.20
    indicators:
      - func: limen.indicators.window_return
        params:
          period: 1
    target:
      name: quantile_flag
      class: limen.targets.QuantileBinaryTarget
      fit_params:
        source_column: ret_1
        quantile: 0.5
      transform_params:
        shift: -1
    scaler:
      class: limen.scalers.RobustScaler
    reference_architecture: limen.sfd.reference_architecture.logreg_binary
    backtest:
      fee_bps: 5.0
      slip_bps: 5.0
      notional_rate: 1.0
  params:
    C: [0.01, 1.0]
    solver: [lbfgs]
    random_state: [42]
    max_iter: [2, 5000]
uel:
  n_permutations: 4
  search_strategy:
    type: grid
  prep_each_round: true
  output_format: csv
