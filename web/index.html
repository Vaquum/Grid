<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grid</title>
<style>/*{{CSS}}*/</style>
</head>
<body>
<div id="app" class="app" data-state="loading">
  <header class="top" id="top">
    <div class="brand">
      <svg class="mark" viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="1" width="6" height="6" rx="1.2"/><rect class="o" x="9.5" y="1.5" width="5" height="5" rx="1"/><rect class="o" x="1.5" y="9.5" width="5" height="5" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1.2"/></svg>
      <span class="brand-name">Grid</span>
    </div>
    <p class="loading-note" id="loading-note">Reading the sweep…</p>
  </header>
  <div class="shell" id="shell"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="tip" class="tip" role="tooltip" hidden></div>
</div>
<script id="grid-config" type="application/json">{{CONFIG}}</script>
<script id="grid-pack" type="application/octet-stream">{{PACK}}</script>
<script>/*{{SCRIPT}}*/</script>
</body>
</html>
